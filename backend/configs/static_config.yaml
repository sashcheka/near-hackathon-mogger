components_manager:
  task_processors:
    main-task-processor:
      worker_threads: 2
    fs-task-processor:
      worker_threads: 1
  default_task_processor: main-task-processor

  components:
    server:
      listener:
        address: 0.0.0.0
        port: 8080
        task_processor: main-task-processor

    logging:
      fs-task-processor: fs-task-processor
      loggers:
        default:
          file_path: '@stderr'
          level#env: LOG_LEVEL
          level#fallback: warning
          overflow_behavior: discard

    handler-health:
      path: /health
      method: GET
      task_processor: main-task-processor

    handler-auth:
      path: /auth/{action}
      method: GET,POST,DELETE
      task_processor: main-task-processor
      max_request_size: 4096
      rpc-url#env: NEAR_TESTNET_RPC_URL
      rpc-url#fallback: https://rpc.testnet.near.org
      recipient#env: AUTH_RECIPIENT
      recipient#fallback: localhost:5173

    handler-balance:
      path: /wallets/{account_id}/balance
      method: GET
      task_processor: main-task-processor
      rpc-url#env: NEAR_TESTNET_RPC_URL
      rpc-url#fallback: https://rpc.testnet.near.org

    handler-products:
      path: /products
      method: GET
      task_processor: main-task-processor

    handler-orders:
      path: /orders
      method: GET,POST
      task_processor: main-task-processor

    handler-policy:
      path: /purchase-policy/{action}
      method: GET,PUT
      task_processor: main-task-processor
      max_request_size: 4096

    handler-checkouts:
      path: /checkouts
      method: GET,POST
      task_processor: main-task-processor
      max_request_size: 8192

    handler-checkout-details:
      path: /checkouts/{checkout_id}
      method: GET
      task_processor: main-task-processor

    handler-order-details:
      path: /orders/{order_id}
      method: GET
      task_processor: main-task-processor

    merchant-settings:
      account-id#env: MERCHANT_ACCOUNT_ID
      account-id#fallback: ''

    handler-verify-payment:
      path: /orders/{order_id}/verify-payment
      method: POST
      task_processor: main-task-processor
      rpc-url#env: NEAR_TESTNET_RPC_URL
      rpc-url#fallback: https://rpc.testnet.near.org

    handler-purchase:
      path: /purchase-requests
      method: POST
      task_processor: main-task-processor
      ollama-url#env: OLLAMA_CHAT_URL
      ollama-url#fallback: ''
      ollama-model#env: OLLAMA_MODEL
      ollama-model#fallback: qwen3:1.7b

    http-client: {}
    http-client-core:
      threads: 1
      fs-task-processor: fs-task-processor

    dns-client:
      fs-task-processor: fs-task-processor

    testsuite-support: {}

    postgres-db:
      dbconnection#env: POSTGRES_DSN
      dbconnection#fallback: postgresql://treasury:local-dev-only@postgres:5432/treasury
      blocking_task_processor: fs-task-processor
      dns_resolver: async
      min_pool_size: 1
      max_pool_size: 4
      connlimit_mode: manual
