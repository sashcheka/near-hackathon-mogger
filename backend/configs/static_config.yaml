components_manager:
  task_processors:
    main-task-processor:
      worker_threads: 2
    fs-task-processor:
      worker_threads: 1
  default_task_processor: main-task-processor

  components:
    server:
      listener:
        address: 0.0.0.0
        port: 8080
        task_processor: main-task-processor

    logging:
      fs-task-processor: fs-task-processor
      loggers:
        default:
          file_path: '@stderr'
          level: info
          overflow_behavior: discard

    handler-health:
      path: /health
      method: GET
      task_processor: main-task-processor

    handler-products:
      path: /products
      method: GET
      task_processor: main-task-processor

    dns-client:
      fs-task-processor: fs-task-processor

    testsuite-support: {}

    postgres-db:
      dbconnection#env: POSTGRES_DSN
      dbconnection#fallback: postgresql://treasury:local-dev-only@postgres:5432/treasury
      blocking_task_processor: fs-task-processor
      dns_resolver: async
      min_pool_size: 1
      max_pool_size: 4
      connlimit_mode: manual
