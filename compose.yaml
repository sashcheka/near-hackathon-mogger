name: near-hackathon-mogger

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: treasury
      POSTGRES_USER: treasury
      POSTGRES_PASSWORD: local-dev-only
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/db/treasury.sql:/docker-entrypoint-initdb.d/001-treasury.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U treasury -d treasury"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
